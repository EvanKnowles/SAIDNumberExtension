<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>SA ID Number Generator</title>

    <link rel="stylesheet" type="text/css" href="generator.css">

    <script src="jQuery.js"></script>
    <script src="jSAID.js"></script>
    <script src="idgenerator.js"></script>
</head>

<body>
<div class="app">
    <header class="app-header">
        <h1>SA ID Number</h1>
        <div class="id-status" role="status" aria-live="polite"></div>
    </header>

    <div class="id-field">
        <div class="id-text-container">
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
            <input type="text" class="id-omnibox" inputmode="numeric" autocomplete="off" aria-label="ID digit"/>
        </div>
    </div>

    <div class="controls">
        <label class="field">
            <span class="field-label">Date of birth</span>
            <input type="date" class="dob" max="9999-12-31"/>
        </label>

        <div class="toggle-row">
            <label class="toggle">
                <span class="switch">
                    <input type="checkbox" class="male"/>
                    <span class="slider"></span>
                </span>
                <span class="toggle-caption">Male</span>
            </label>

            <label class="toggle">
                <span class="switch">
                    <input type="checkbox" class="citizen"/>
                    <span class="slider"></span>
                </span>
                <span class="toggle-caption">SA citizen</span>
            </label>
        </div>

        <div class="button-row">
            <button type="button" class="btn random-button">Random</button>
            <button type="button" class="btn btn-primary generate-button">Generate</button>
            <button type="button" class="btn copy-button">Copy</button>
        </div>

        <p class="hint">You can also insert random ID numbers straight into a page via the right-click context menu.</p>
    </div>
</div>
<textarea class="hidden" aria-hidden="true" tabindex="-1"></textarea>
</body>
</html>
